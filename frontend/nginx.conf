# nginx del Dashboard Web (spec §7, §8.3). Sirve la SPA y hace de proxy de /api al backend, así
# el Dashboard y la API comparten origen: la cookie del refresh (SameSite=Strict,
# Path=/api/v1/auth, H-36) viaja sin CORS, igual que con el proxy de Vite en desarrollo.

server {
    listen 8080;
    server_name _;

    # No anunciar la versión de nginx en cabeceras ni páginas de error.
    server_tokens off;

    # El backend rechaza con 413 problem+json los cuerpos de más de 1 MiB (spec §7). Este margen
    # deja que esa respuesta la dé el backend y no una página HTML de nginx.
    client_max_body_size 2m;

    root /usr/share/nginx/html;

    # H-79: si el operador declara un proxy con TLS de confianza (PORTERO_TRUSTED_PROXY), el
    # script docker-entrypoint.d/40-portero-realip.sh escribe aquí set_real_ip_from y
    # real_ip_header, y $remote_addr pasa a ser la IP real del cliente. Sin la variable no existe
    # ningún archivo, el comodín no coincide con nada y la configuración es la de siempre.
    include /tmp/portero-realip*.conf;

    # API REST Gateway. El backend pone sus propias cabeceras de seguridad (spec §7: HSTS,
    # nosniff, X-Frame-Options, Cache-Control: no-store); aquí no se agregan para no duplicarlas.
    location /api/ {
        # Se resuelve "backend" con el DNS interno de Docker en cada petición (caché de 10 s) y no
        # una sola vez al arrancar: si el contenedor del backend se recrea con otra IP, el proxy
        # sigue funcionando. Con una variable, nginx pasa la URI tal cual (/api/v1/...).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP real del cliente para el límite de login por IP y para la bitácora (H-53). Se
        # SOBRESCRIBE con la IP que ve nginx: un X-Forwarded-For enviado por el cliente se descarta,
        # así que no se puede falsificar. uvicorn solo lo cree si viene de la IP fija de nginx.
        # Detrás de un proxy declarado (H-79), $remote_addr ya es la IP que ese proxy reportó.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos de Vite con hash en el nombre: inmutables, se pueden guardar en caché un año.
    # Un archivo que no existe da 404 (no index.html).
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta (/proyectos/..., /bitacora) devuelve index.html y la resuelve
    # React Router. index.html no se guarda en caché para que un despliegue nuevo se vea de
    # inmediato.
    location / {
        include /etc/nginx/security-headers.conf;
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}
