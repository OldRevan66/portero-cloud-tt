# Cabeceras de seguridad del Dashboard (spec §7; OWASP ASVS V14.4). Se incluyen en cada
# location de la SPA: en nginx, un add_header dentro de un location anula los heredados del
# server, así que tenerlas en un solo archivo evita que una se pierda.
#
# CSP (H-52): la de la spec §7 más `style-src 'self' 'unsafe-inline'`, porque Mantine 7 inyecta
# etiquetas <style> y usa atributos style= para sus variables CSS. Los scripts siguen limitados a
# 'self' (sin scripts en línea), que es lo que frena un XSS.
# form-action (H-65): default-src no la cubre; sin ella, un formulario inyectado podría enviar
# datos (p. ej. credenciales) a otro origen.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# Las URL llevan identificadores de proyectos y secretos: no se envían a otros sitios.
add_header Referrer-Policy "no-referrer" always;
# H-65: el Dashboard no usa cámara, micrófono ni ubicación; ninguna página (ni un iframe) puede
# pedirlos.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# H-71 (ZAP 90004): aislamiento entre orígenes. COOP: una ventana de otro origen abierta con
# window.open (o que abrió al Dashboard) no obtiene referencia a la nuestra. CORP: otro sitio no
# puede incrustar nuestras respuestas (<script>, <img>), lo que limita lecturas tipo Spectre.
# COEP: el Dashboard solo carga recursos propios (CSP 'self'), así que exigir CORP no rompe nada.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
