[project]
name = "portero"
version = "1.0.0"
description = "Portero Cloud: gestión de secretos en la nube para equipos de desarrollo de PyMEs (TT 2026-B067)"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    # SQLAlchemy 2.0 (no 2.1) asíncrono con asyncpg: Cap. 6 §Stack backend (H-17).
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13",
    "asyncpg>=0.30,<0.33",
    "cryptography>=47",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portero"]

# --- Calidad: ruff (E/F/I/B + reglas S de bandit + UP) ---
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# En pytest las aserciones con assert son el mecanismo normal de verificación.
"tests/**" = ["S101"]

# --- Pruebas ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requiere PostgreSQL de pruebas (docker compose up -d db-test)",
]

[tool.coverage.run]
source = ["portero"]
branch = true
# SQLAlchemy asíncrono ejecuta el código en greenlets; sin esto coverage pierde las líneas
# posteriores a un await que pasa por la BD.
concurrency = ["greenlet", "thread"]

# --- Tipos: mypy --strict en los módulos de seguridad y persistencia ---
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["portero.crypto.*", "portero.rbac.*", "portero.db.*", "portero.oplog.*"]
strict = true
