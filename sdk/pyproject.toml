[project]
name = "portero-cloud-sdk"
version = "1.0.0"
description = "SDK Python de Portero Cloud: lectura de secretos con un PAT (CU-04, Cap. 6 §Diseño del SDK Python)"
license = "MIT"
# El SDK corre en las aplicaciones de las PyMEs, no en el contenedor del backend: no se ata a
# 3.12. 3.10 es lo mínimo para dataclass(slots=True) y la sintaxis X | None.
requires-python = ">=3.10"
# Cap. 6 §Modelos de uso síncrono y asíncrono: httpx (una API para ambos modelos) y Pydantic.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portero_cloud_sdk"]

# --- Calidad: mismas reglas que el backend (E/F/I/B + S de bandit + UP) ---
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# assert es el mecanismo de pytest; S105/S106 marcan las constantes TOKEN de prueba, que son
# marcadores obvios ("no-es-real"), no credenciales.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
# Fijo, para que el orden no cambie según el paquete esté instalado o no.
known-first-party = ["portero_cloud_sdk", "apoyo"]

# --- Pruebas ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
# tests/apoyo.py (servidor falso y constantes) se importa como módulo normal.
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "vivo: contra el stack de desarrollo con seed (PORTERO_SDK_BASE_URL y PORTERO_SDK_TOKEN)",
]

[tool.coverage.run]
source = ["portero_cloud_sdk"]
branch = true

# --- Tipos: mypy --strict en todo el SDK (Cap. 6 §Alcance y filosofía, "Idiomatic Python") ---
[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["src", "tests"]
